name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check server
        run: node --check server/src/index.js
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
